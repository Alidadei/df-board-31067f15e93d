function b64(s){ return atob(s); }
async function tryUnlock(pw){
  try{
    var enc = new TextEncoder();
    var keyRaw = await crypto.subtle.digest("SHA-256", enc.encode(pw));
    var key = await crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"]);
    var iv = Uint8Array.from(b64(ENC.iv), c => c.charCodeAt(0));
    var raw = Uint8Array.from(b64(ENC.ct), c => c.charCodeAt(0));
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, raw);
    return new TextDecoder().decode(plain);
  }catch(e){ return null; }
}
async function gateInit(){
  var saved = null;
  try{ saved = localStorage.getItem("df-dash-pw"); }catch(e){}
  if(saved){ var doc = await tryUnlock(saved); if(doc){ show(doc); return; } }
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gateBtn").onclick = doUnlock;
  document.getElementById("gateInput").onkeydown = function(ev){ if(ev.key==="Enter") doUnlock(); };
}
async function doUnlock(){
  var pw = document.getElementById("gateInput").value;
  var doc = await tryUnlock(pw);
  if(doc){
    try{ localStorage.setItem("df-dash-pw", pw); }catch(e){}
    show(doc);
  }else{
    document.getElementById("gateErr").textContent = "\u5bc6\u7801\u4e0d\u5bf9\uff0c\u518d\u8bd5\u8bd5";
    document.getElementById("gateInput").select();
  }
}
function show(doc){
  document.getElementById("gate").classList.add("hidden");
  var f = document.getElementById("frame");
  f.style.display = "block";
  f.srcdoc = doc;
}
gateInit();
</script>
